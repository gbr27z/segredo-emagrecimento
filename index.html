      fbq('init', '2178586076074417');

      // RASTREIO DE CHECKOUT E BACK-REDIRECT
      // Dispara SOMENTE quando o usuário clica no checkout da Cakto
      (function() {
        document.addEventListener('click', function(e) {
          var link = e.target.closest('a');
          if (link && link.href && link.href.indexOf('cakto.com.br') !== -1) {
            if (typeof fbq === 'function') {
              fbq('track', 'InitiateCheckout', {
                content_name: 'A Fórmula da Insulina',
                value: 27.90,
                currency: 'BRL'
              });
            }
            try {
              // Injeta /desconto/ no histórico para que se o usuário voltar do checkout, caia na oferta com desconto
              history.pushState(null, '', '/desconto/');
            } catch(err) {}
          }
        });
      })();
    </script>
